---
name: Test

on:
  pull_request: {}
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  rubocop:
    env:
      BUNDLE_WITHOUT: release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Run Rubocop
        run: bundle exec rake rubocop
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - ruby: "2.7"
            openvox: "~> 7"
          - ruby: "3.0"
            openvox: "~> 7"
          - ruby: "3.1"
            openvox: "~> 7"
          - ruby: "3.2"
            openvox: "~> 8"
          - ruby: "3.2"
            openvox: "~> 7"
          - ruby: "3.2"
            openvox: "https://github.com/OpenVoxProject/puppet.git#main"
          - ruby: "3.3"
            openvox: "~> 8"
          - ruby: "3.3"
            openvox: "~> 7"
          - ruby: "3.3"
            openvox: "https://github.com/OpenVoxProject/puppet.git#main"
          - ruby: "3.4"
            openvox: "~> 8"
          - ruby: "3.4"
            openvox: "https://github.com/OpenVoxProject/puppet.git#main"
          - ruby: "4.0"
            openvox: "~> 8"
          - ruby: "4.0"
            openvox: "https://github.com/OpenVoxProject/puppet.git#main"
          - ruby: jruby-9.4
            openvox: "~> 7"
          - ruby: jruby-9.4
            openvox: "~> 7"
            bouncycastle: "1.85"
          - ruby: jruby-10.0
            openvox: "~> 8"
          - ruby: jruby-10.0
            openvox: "~> 8"
            bouncycastle: "1.85"
          - ruby: jruby-10.0
            openvox: "https://github.com/OpenVoxProject/puppet.git#main"
          - ruby: jruby-10.0
            openvox: "https://github.com/OpenVoxProject/puppet.git#main"
            bouncycastle: "1.85"
          - ruby: jruby-10.1
            openvox: "~> 8"
          - ruby: jruby-10.1
            openvox: "~> 8"
            bouncycastle: "1.85"
          - ruby: jruby-10.1
            openvox: "https://github.com/OpenVoxProject/puppet.git#main"
          - ruby: jruby-10.1
            openvox: "https://github.com/OpenVoxProject/puppet.git#main"
            bouncycastle: "1.85"

    env:
      OPENVOX_VERSION: ${{ matrix.openvox }}
      COVERAGE: ${{ matrix.coverage }}
      BOUNCYCASTLE_VERSION: ${{ matrix.bouncycastle || '' }}
    name: "Ruby ${{ matrix.ruby }} - OpenVox ${{ matrix.openvox }}${{ startsWith(matrix.ruby, 'jruby') && matrix.bouncycastle && format(' - BouncyCastle {0}', matrix.bouncycastle) || '' }}"
    steps:
      - name: Enable coverage reporting on Ruby 3.1
        if: matrix.openvox == '~> 7' && matrix.ruby == '3.1'
        run: echo 'COVERAGE=yes' >> $GITHUB_ENV
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Ruby ${{ matrix.ruby }}
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - name: Install BouncyCastle ${{ env.BOUNCYCASTLE_VERSION }} for JRuby
        if: env.BOUNCYCASTLE_VERSION != ''
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .java-bc
          curl -fsSL "https://repo1.maven.org/maven2/org/bouncycastle/bcprov-jdk18on/${BOUNCYCASTLE_VERSION}/bcprov-jdk18on-${BOUNCYCASTLE_VERSION}.jar" -o .java-bc/bcprov-jdk18on.jar
          curl -fsSL "https://repo1.maven.org/maven2/org/bouncycastle/bcpkix-jdk18on/${BOUNCYCASTLE_VERSION}/bcpkix-jdk18on-${BOUNCYCASTLE_VERSION}.jar" -o .java-bc/bcpkix-jdk18on.jar
          echo "CLASSPATH=${PWD}/.java-bc/bcprov-jdk18on.jar:${PWD}/.java-bc/bcpkix-jdk18on.jar${CLASSPATH:+:${CLASSPATH}}" >> "$GITHUB_ENV"
          echo "JRUBY_OPTS=${JRUBY_OPTS:-} -J-classpath ${PWD}/.java-bc/bcprov-jdk18on.jar:${PWD}/.java-bc/bcpkix-jdk18on.jar" >> "$GITHUB_ENV"
      - name: Display Ruby environment
        run: bundle env
      - name: spec tests
        run: bundle exec rake features
      - name: Verify gem builds
        run: gem build --strict --verbose *.gemspec

  tests:
    if: always()
    needs:
      - rubocop
      - test
    runs-on: ubuntu-24.04
    name: Test suite
    steps:
      - name: Decide whether the needed jobs succeeded or failed
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
